services:
  - type: web
    name: comp-intel-api-mehe
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /health
    envVars: &backend-env
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_PLACES_TIMEOUT_SECONDS
        value: "20"
      - key: GOOGLE_PLACES_MAX_SEARCH_PAGES
        value: "3"
      - key: DISCOVERY_PROVIDER
        value: google_places
      - key: QUEUE_STALE_TIMEOUT_SECONDS
        value: "60"
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: worker
    name: comp-intel-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: arq app.workers.main.WorkerSettings
    envVars: *backend-env

  - type: web
    name: comp-intel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
